services:
  - type: web
    name: financebot-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: financebot-db
          property: connectionString
      - key: DATABASE_SSL
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://financebot-api.onrender.com
      - key: PUBLIC_DASHBOARD_URL
        value: https://financebot-api.onrender.com
      - key: WHATSAPP_PROVIDER
        value: mock

databases:
  - name: financebot-db
    databaseName: financebot
    user: financebot
    plan: free
